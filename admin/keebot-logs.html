<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeeBot Logs · Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:24px;max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin-bottom:4px}
h1 span{color:#a78bfa}
.sub{color:#94a3b8;font-size:.85rem;margin-bottom:24px}
.log-entry{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:8px}
.log-meta{display:flex;gap:12px;font-size:.75rem;color:#64748b;margin-bottom:8px}
.log-meta span{padding:2px 8px;background:#334155;border-radius:4px}
.log-meta .user{background:#7c3aed;color:#fff}
.log-meta .assistant{background:#0d9488;color:#fff}
.log-content{font-size:.9rem;line-height:1.5;color:#cbd5e1}
.empty{text-align:center;padding:48px;color:#64748b}
.error{background:#451a1a;border:1px solid #991b1b;border-radius:8px;padding:16px;color:#fca5a5;margin-bottom:16px}
.loading{text-align:center;padding:48px;color:#64748b}
.refresh-btn{display:inline-block;background:#7c3aed;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.8rem;margin-bottom:20px}
.refresh-btn:hover{background:#6d28d9}
.session-group{margin-bottom:24px}
.session-header{font-size:.8rem;color:#a78bfa;margin-bottom:8px;padding:4px 12px;background:#1e1b4b;border-radius:6px;display:inline-block}
</style>
</head>
<body>
<h1>KeeBot <span>Logs</span></h1>
<p class="sub">Recent conversations across all pages</p>
<button class="refresh-btn" onclick="loadLogs()">🔄 Refresh</button>
<div id="logs"><div class="loading">Loading...</div></div>

<script>
const SUPABASE_URL = 'https://qflaflwkzdxuhqekhxos.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbGFmbHdremR4dWhxZWtoeG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTE5NjQsImV4cCI6MjA5NDU4Nzk2NH0.55PLTeZofzb6Yyyw3mhZDDnOs14NILMTr352rOWvBGk';

async function loadLogs() {
  const el = document.getElementById('logs');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const resp = await fetch(
      SUPABASE_URL + '/rest/v1/keebot_messages?order=created_at.desc&limit=50',
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
    );
    if (!resp.ok) { el.innerHTML = '<div class="error">Failed to load (HTTP ' + resp.status + ')</div>'; return; }
    const data = await resp.json();
    if (!data || data.length === 0) { el.innerHTML = '<div class="empty">No conversations yet. When users chat with KeeBot, their messages will appear here.</div>'; return; }
    
    const sessions = {};
    data.forEach(m => {
      const sid = m.session_id || 'unknown';
      if (!sessions[sid]) sessions[sid] = [];
      sessions[sid].push(m);
    });
    
    let html = '';
    for (const [sid, msgs] of Object.entries(sessions)) {
      msgs.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
      const first = msgs[0];
      html += '<div class="session-group">';
      html += '<div class="session-header">' + (first.page||'?') + ' · ' + new Date(first.created_at).toLocaleString() + ' · ' + msgs.length + ' msgs</div>';
      msgs.forEach(m => {
        html += '<div class="log-entry">';
        html += '<div class="log-meta"><span class="' + m.role + '">' + m.role + '</span><span>' + new Date(m.created_at).toLocaleTimeString() + '</span></div>';
        html += '<div class="log-content">' + escapeHtml(m.content||'') + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">Error: ' + e.message + '</div>'; }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

loadLogs();
setInterval(loadLogs, 30000);
</script>
</body>
</html>
