<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>807 听力词卡 | IELTS with Kee 🦄</title>
<style>
:root {
  --purple: #9F44D3; --purple-light: #b77ae0; --purple-dark: #7a2ea8;
  --pink: #FF2442; --pink-light: #ff6b7a;
  --white: #fff; --gray-50: #fafafa; --gray-100: #f5f5f5;
  --gray-200: #eee; --gray-600: #757575; --gray-700: #616161; --gray-900: #212121;

  --radius: 12px; --radius-lg: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--gray-50);color:var(--gray-900);line-height:1.65;min-height:100vh
}

/* Nav */
.site-nav{background:var(--white);border-bottom:2px solid var(--gray-200);position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav-inner{max-width:800px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--gray-900);text-decoration:none}
.nav-brand span{color:var(--purple)}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{font-size:13px;font-weight:500;color:var(--gray-600);text-decoration:none}
.nav-links a:hover{color:var(--purple)}

/* Main */
.container{max-width:800px;margin:0 auto;padding:24px 20px 60px}

/* Header */
.header{text-align:center;padding:32px 0 20px}
.header h1{font-size:clamp(22px,4vw,32px);font-weight:700;margin-bottom:6px}
.header h1 span{background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:14px;color:var(--gray-600)}

/* Progress bar */
.progress-bar{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.progress-stat{text-align:center;min-width:80px}
.progress-stat .num{font-size:28px;font-weight:700;color:var(--purple)}
.progress-stat .label{font-size:11px;color:var(--gray-600);text-transform:uppercase;letter-spacing:0.06em}
.progress-divider{width:1px;height:32px;background:var(--gray-200)}

/* Card */
.card-area{perspective:1000px;-webkit-perspective:1000px;max-width:500px;margin:0 auto 24px}
.card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);-webkit-transition:-webkit-transform 0.5s cubic-bezier(0.4,0,0.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card-face{position:absolute;top:0;left:0;right:0;bottom:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;border:2px solid var(--gray-200)}
.card-front{background:var(--white);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card-back{background:linear-gradient(135deg,#f3e8ff,#fff0f3);transform:rotateY(180deg);-webkit-transform:rotateY(180deg);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card-front .word{font-size:clamp(28px,5vw,40px);font-weight:700;color:var(--gray-900);text-align:center;margin-bottom:8px}
.card-front .phonetic{font-size:16px;color:var(--gray-600);margin-bottom:16px}
.card-front .tap-hint{font-size:11px;color:var(--gray-600);opacity:0.6;position:absolute;bottom:16px}
.card-back .word-sm{font-size:18px;font-weight:700;color:var(--purple);margin-bottom:6px}
.card-back .definition{font-size:16px;color:var(--gray-900);text-align:center;line-height:1.6;margin-bottom:8px}
.card-back .zh{font-size:15px;color:var(--purple-dark);text-align:center;margin-bottom:12px}
.card-back .example{font-size:13px;color:var(--gray-600);font-style:italic;text-align:center;max-width:380px}
.card-back .pos-tag{display:inline-block;padding:2px 10px;background:var(--purple);color:#fff;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:12px}

/* Buttons */
.actions{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:12px 28px;border-radius:30px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all 0.2s;font-family:inherit}
.btn-again{background:#fef2f2;color:#dc2626;border:2px solid #fecaca}
.btn-again:hover{background:#fecaca}
.btn-good{background:#ecfdf5;color:#059669;border:2px solid #a7f3d0}
.btn-good:hover{background:#a7f3d0}
.btn-easy{background:#eff6ff;color:#2563eb;border:2px solid #bfdbfe}
.btn-easy:hover{background:#bfdbfe}
.btn-flip{background:var(--white);color:var(--purple);border:2px solid var(--gray-200);padding:10px 24px}
.btn-flip:hover{border-color:var(--purple)}

/* Queue info */
.queue-info{text-align:center;font-size:13px;color:var(--gray-600);margin-bottom:16px}
.queue-info strong{color:var(--purple)}

/* Session recap */
.session-recap{background:var(--white);border-radius:var(--radius);padding:20px 24px;border:1px solid var(--gray-200);max-width:500px;margin:32px auto 0;display:none}
.session-recap.show{display:block}
.session-recap h3{font-size:16px;margin-bottom:12px}
.session-recap .recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.session-recap .recap-item{display:flex;justify-content:space-between;padding:6px 10px;background:var(--gray-50);border-radius:6px}
.session-recap .recap-item .val{font-weight:700}

/* Deck selection */
.deck-selector{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.deck-chip{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid var(--gray-200);background:var(--white);cursor:pointer;transition:all 0.2s}
.deck-chip:hover{border-color:var(--purple-light)}
.deck-chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}

@media(max-width:480px){
  .card{min-height:260px}
  .card-front .word{font-size:26px}
  .actions{gap:8px}
  .btn{padding:10px 20px;font-size:13px}
}

.cefr-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px;text-transform:uppercase;vertical-align:middle}
.cefr-A1{background:#e8f5e9;color:#2e7d32}
.cefr-A2{background:#e3f2fd;color:#1565c0}
.cefr-B1{background:#fff3e0;color:#e65100}
.cefr-B2{background:#fce4ec;color:#c62828}
.cefr-C1{background:#f3e5f5;color:#6a1b9a}
.cefr-C2{background:#eceff1;color:#37474f}

.cefr-filter{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.cefr-chip{padding:4px 12px;border-radius:14px;font-size:11px;font-weight:700;border:2px solid var(--gray-200);background:var(--white);cursor:pointer;transition:all 0.15s}
.cefr-chip:hover{border-color:var(--purple-light)}
.cefr-chip.active{border-color:var(--purple);background:var(--purple);color:#fff}
.cefr-chip.all{background:var(--gray-900);color:#fff;border-color:var(--gray-900)}
.cefr-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px;text-transform:uppercase;vertical-align:middle}
.cefr-A1{background:#e8f5e9;color:#2e7d32}.cefr-A2{background:#e3f2fd;color:#1565c0}
.cefr-B1{background:#fff3e0;color:#e65100}.cefr-B2{background:#fce4ec;color:#c62828}
.cefr-C1{background:#f3e5f5;color:#6a1b9a}.cefr-C2{background:#eceff1;color:#37474f}
</style>

  </div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-flip" onclick="flipCard()">🔄 翻转</button>
  <button class="btn btn-again" id="btnAgain" onclick="rateCard(1)" style="display:none">🔁 再来一次</button>
  <button class="btn btn-good" id="btnGood" onclick="rateCard(3)" style="display:none">👍 认识</button>
  <button class="btn btn-easy" id="btnEasy" onclick="rateCard(5)" style="display:none">✅ 太简单</button>
</div>

<!-- Session recap -->
<div class="session-recap" id="recap">
  <h3>📊 本轮统计</h3>
  <div class="recap-grid">
    <div class="recap-item"><span>已复习</span><span class="val" id="recapReviewed">0</span></div>
    <div class="recap-item"><span>掌握</span><span class="val" id="recapMastered">0</span></div>
    <div class="recap-item"><span>新词学习中</span><span class="val" id="recapLearning">0</span></div>
    <div class="recap-item"><span>正确率</span><span class="val" id="recapAccuracy">—</span></div>
  </div>
  <button class="btn btn-flip" onclick="resetSession()" style="margin-top:12px;width:100%">🔄 再来一轮</button>
</div>

// ============ APP STATE ============
const STORAGE_KEY = 'ielts-anki-state';
let state = loadState();
let currentDeck = 'ielts-core';
let currentCard = null;
let currentWordIndex = -1;
let reviewQueue = [];
let sessionReviewed = 0;
let sessionMastered = 0;

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return {decks:{}};
}

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function getDeckState(deckKey){
  if(!state.decks[deckKey]) state.decks[deckKey] = {};
  return state.decks[deckKey];
}


let selectedCefr = 'all';

function renderCefrFilter(){
  const el = document.getElementById('cefrFilter');
  const words = decks[currentDeck].words;

  // Group by target band
  var band55 = words.filter(function(w){ return w.cefr === 'A1' || w.cefr === 'A2' || w.cefr === 'B1'; }).length;
  var band65 = words.filter(function(w){ return w.cefr === 'B2' || w.cefr === 'C1'; }).length;
  var band7p = words.filter(function(w){ return w.cefr === 'C2'; }).length;

  var active = selectedCefr;
  el.innerHTML =
    '<button class="cefr-chip all' + (active==='all'?' active':'') + '" onclick="filterCefr(\'all\')">\u5168\u90e8 (' + words.length + ')</button>' +
    '<button class="cefr-chip' + (active==='5.5'?' active':'') + '" onclick="filterCefr(\'5.5\')">\ud83c\udfaf 5.5\u5206 (A1-B1) ' + band55 + '</button>' +
    '<button class="cefr-chip' + (active==='6.5'?' active':'') + '" onclick="filterCefr(\'6.5\')">\ud83c\udfaf 6.5\u5206 (B2-C1) ' + band65 + '</button>' +
    (band7p > 0 ? '<button class="cefr-chip' + (active==='7+'?' active':'') + '" onclick="filterCefr(\'7+\')">\ud83c\udfaf 7+\u5206 (C2) ' + band7p + '</button>' : '');
}

function filterCefr(level){
  selectedCefr = level;
  renderCefrFilter();
  sessionReviewed = 0;
  sessionMastered = 0;
  buildQueue();
  updateUI();
  nextCard();
}

// Override buildQueue to support CEFR filtering
const _buildQueue = buildQueue;
buildQueue = function(){
  const ds = getDeckState(currentDeck);
  const words = decks[currentDeck].words;
  reviewQueue = [];
  const now = Date.now();
  const toReview = [];
  const newWords = [];
  
  words.forEach((w,i) => {
    if(selectedCefr !== 'all'){
      var match = false;
      if(selectedCefr === '5.5' && (w.cefr === 'A1' || w.cefr === 'A2' || w.cefr === 'B1')) match = true;
      if(selectedCefr === '6.5' && (w.cefr === 'B2' || w.cefr === 'C1')) match = true;
      if(selectedCefr === '7+' && w.cefr === 'C2') match = true;
      if(!match) return;
    }
    const ws = ds[i];
    if(!ws || ws.stage === 0) newWords.push(i);
    else if(ws.nextReview && ws.nextReview <= now) toReview.push(i);
  });
  
  shuffle(toReview);
  shuffle(newWords);
  reviewQueue = [...toReview, ...newWords];
  currentWordIndex = -1;
};

function init(){
  renderDeckSelector();
  switchDeck(currentDeck);
}

function renderDeckSelector(){
  const el = document.getElementById('deckSelector');
  el.innerHTML = Object.entries(decks).map(([key,deck]) =>
    `<button class="deck-chip${key===currentDeck?' active':''}" onclick="switchDeck('${key}')">${deck.name}</button>`
  ).join('');
}

function switchDeck(deckKey){
  currentDeck = deckKey;
  selectedCefr = 'all';
  renderDeckSelector();
  renderCefrFilter();
  sessionReviewed = 0;
  sessionMastered = 0;
  buildQueue();
  updateUI();
  nextCard();
}

function buildQueue(){
  const ds = getDeckState(currentDeck);
  const words = decks[currentDeck].words;
  reviewQueue = [];
  
  // Add due-for-review words first, then new words
  const now = Date.now();
  const toReview = [];
  const newWords = [];
  
  words.forEach((w,i) => {
    const ws = ds[i];
    if(!ws || ws.stage === 0){
      newWords.push(i);
    } else if(ws.nextReview && ws.nextReview <= now){
      toReview.push(i);
    }
  });
  
  // Shuffle review queue, then append new
  shuffle(toReview);
  shuffle(newWords);
  reviewQueue = [...toReview, ...newWords];
  currentWordIndex = -1;
}

function shuffle(arr){
  for(let i = arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function nextCard(){
  currentWordIndex++;
  if(currentWordIndex >= reviewQueue.length){
    showRecap();
    return;
  }
  
  const wordIdx = reviewQueue[currentWordIndex];
  const word = decks[currentDeck].words[wordIdx];
  currentCard = {wordIdx, word};
  
  document.getElementById('recap').classList.remove('show');
  document.getElementById('wordFront').textContent = word.word;
  document.getElementById('phonetic').textContent = word.phonetic;
  document.getElementById('wordBack').textContent = word.word;
  document.getElementById('posTag').textContent = word.pos;
  const badge = document.getElementById('cefrBadge');
  badge.textContent = word.cefr || '';
  badge.className = 'cefr-badge cefr-' + (word.cefr || '');
  badge.style.display = word.cefr ? 'inline-block' : 'none';
  document.getElementById('cefrBadge').textContent = word.cefr || '';
  document.getElementById('cefrBadge').style.display = word.cefr ? 'inline-block' : 'none';
  document.getElementById('cefrBadge').className = 'cefr-badge cefr-' + (word.cefr || '');
  document.getElementById('definition').textContent = word.def;
  document.getElementById('zhDef').textContent = word.zh;
  document.getElementById('example').textContent = `"${word.ex}"`;
  
  // Reset card
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('btnAgain').style.display = 'none';
  document.getElementById('btnGood').style.display = 'none';
  document.getElementById('btnEasy').style.display = 'none';
  
  updateUI();
}

function flipCard(){
  const card = document.getElementById('card');
  card.classList.toggle('flipped');
  
  if(card.classList.contains('flipped')){
    document.getElementById('btnAgain').style.display = 'inline-block';
    document.getElementById('btnGood').style.display = 'inline-block';
    document.getElementById('btnEasy').style.display = 'inline-block';
  }
}

function rateCard(quality){
  const ds = getDeckState(currentDeck);
  const idx = currentCard.wordIdx;
  const ws = ds[idx] || {stage:0, ease:2.5, interval:0, nextReview:0, reviews:0};
  
  ws.reviews++;
  sessionReviewed++;
  
  if(quality >= 3){
    sessionMastered++;
    // Anki-style scheduling
    if(ws.stage === 0){
      ws.interval = 1; // 1 day
      ws.stage = 1;
    } else if(ws.stage === 1){
      ws.interval = quality >= 5 ? 4 : 2;
      ws.stage = 2;
    } else {
      ws.interval = Math.round(ws.interval * ws.ease);
      ws.stage++;
    }
    ws.ease = Math.max(1.3, ws.ease + (0.1 * (quality - 3)));
  } else {
    // Again: reset
    ws.stage = 0;
    ws.interval = 0;
  }
  
  ws.nextReview = Date.now() + (ws.interval * 86400000);
  ds[idx] = ws;
  saveState();
  
  nextCard();
}

function showRecap(){
  document.getElementById('recap').classList.add('show');
  document.getElementById('wordFront').textContent = '🎉';
  document.getElementById('phonetic').textContent = '本轮完成！';
  document.getElementById('recapReviewed').textContent = sessionReviewed;
  document.getElementById('recapMastered').textContent = sessionMastered;
  document.getElementById('recapLearning').textContent = Math.max(0, sessionReviewed - sessionMastered);
  document.getElementById('recapAccuracy').textContent = sessionReviewed > 0 
    ? Math.round(sessionMastered/sessionReviewed*100) + '%' 
    : '—';
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('btnAgain').style.display = 'none';
  document.getElementById('btnGood').style.display = 'none';
  document.getElementById('btnEasy').style.display = 'none';
}

function resetSession(){
  buildQueue();
  sessionReviewed = 0;
  sessionMastered = 0;
  document.getElementById('recap').classList.remove('show');
  nextCard();
}

function updateUI(){
  const ds = getDeckState(currentDeck);
  const words = decks[currentDeck].words;
  const now = Date.now();
  
  let newCount = 0, reviewCount = 0, doneCount = 0;
  words.forEach((w,i) => {
    const ws = ds[i];
    if(!ws || ws.stage === 0) newCount++;
    else if(ws.nextReview && ws.nextReview <= now) reviewCount++;
    else if(ws.stage >= 1 && (!ws.nextReview || ws.nextReview > now)) doneCount++;
  });
  
  document.getElementById('countNew').textContent = newCount;
  document.getElementById('countReview').textContent = reviewCount;
  document.getElementById('countDone').textContent = doneCount;
  
  const remaining = reviewQueue.length - currentWordIndex - 1;
  if(remaining >= 0 && currentWordIndex >= 0){
    document.getElementById('queueInfo').innerHTML = `第 <strong>${currentWordIndex+1}</strong> / ${reviewQueue.length} 张 · 剩余 <strong>${remaining}</strong> 张`;
  } else if(currentWordIndex >= reviewQueue.length){
    document.getElementById('queueInfo').innerHTML = '✅ 全部完成！';
  }
}

init();
</script>
